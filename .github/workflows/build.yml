name: Build Jinzhao

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version | tee build.log
          swift --version 2>&1 | tee -a build.log

      - name: Build (release)
        run: |
          set -o pipefail
          swift build -c release 2>&1 | tee -a build.log

      - name: Package .app
        run: |
          APP=dist/Jinzhao.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/Holidays"
          cp .build/release/Jinzhao "$APP/Contents/MacOS/Jinzhao"
          cp Jinzhao/Resources/Holidays/*.json "$APP/Contents/Resources/Holidays/"
          # 声明本地化（中/英）：系统据此把标准菜单渲染为中文（文件/编辑/显示/窗口/帮助）
          mkdir -p "$APP/Contents/Resources/zh-Hans.lproj" "$APP/Contents/Resources/en.lproj"
          printf '/* Jinzhao zh-Hans */\n' > "$APP/Contents/Resources/zh-Hans.lproj/InfoPlist.strings"
          printf '/* Jinzhao en */\n' > "$APP/Contents/Resources/en.lproj/InfoPlist.strings"
          # 应用图标（浅/深双外观）编译进 Assets.car
          xcrun actool Assets.xcassets --compile "$APP/Contents/Resources" --platform macosx --target-device mac --minimum-deployment-target 26.0 --app-icon AppIcon --output-partial-info-plist /tmp/assets-info.plist 2>&1 | tee -a build.log
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>今朝</string>
            <key>CFBundleDisplayName</key><string>今朝</string>
            <key>CFBundleIdentifier</key><string>app.jinzhao.dev</string>
            <key>CFBundleExecutable</key><string>Jinzhao</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleIconName</key><string>AppIcon</string>
            <key>CFBundleDevelopmentRegion</key><string>zh-Hans</string>
            <key>CFBundleLocalizations</key><array><string>zh-Hans</string><string>en</string></array>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key><string>26.0</string>
            <key>NSCalendarsFullAccessUsageDescription</key><string>今朝需要完整访问你的日历，把日程和任务放在一起显示，也能帮你新建日程。</string>
            <key>NSRemindersFullAccessUsageDescription</key><string>今朝可以把提醒事项和日程、任务放在一起显示。</string>
          </dict>
          </plist>
          PLIST
          # 临时自签，让本机能启动（正式发布前换开发者签名+公证）
          codesign --force --deep --sign - "$APP"
          cd dist && zip -r ../Jinzhao-dev.zip Jinzhao.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Jinzhao-dev-app
          path: Jinzhao-dev.zip
          retention-days: 30

      # 无论成败，把完整编译日志推到 build-logs 分支，方便 Muse 直接读日志定位错误
      - name: Publish build log
        if: always()
        run: |
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp "$GITHUB_WORKSPACE/build.log" ./build.log || echo "no build.log" > build.log
          echo "" >> build.log
          echo "run: ${{ github.run_id }} commit: ${{ github.sha }} 结果见 Actions 页" >> build.log
          git add build.log
          git commit -q -m "build log ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:build-logs
