name: Build Jinzhao

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Package .app
        run: |
          APP=dist/Jinzhao.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources/Holidays"
          cp .build/release/Jinzhao "$APP/Contents/MacOS/Jinzhao"
          cp Jinzhao/Resources/Holidays/*.json "$APP/Contents/Resources/Holidays/"
          cat > "$APP/Contents/Info.plist" << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>今朝</string>
            <key>CFBundleDisplayName</key><string>今朝</string>
            <key>CFBundleIdentifier</key><string>app.jinzhao.dev</string>
            <key>CFBundleExecutable</key><string>Jinzhao</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>26.0</string>
            <key>NSCalendarsUsageDescription</key><string>今朝需要读取和写入你的日历，把日程和任务放在一起显示。</string>
            <key>NSRemindersUsageDescription</key><string>今朝可以把提醒事项和日程放在一起显示。</string>
          </dict>
          </plist>
          PLIST
          # 临时自签，让本机能启动（正式发布前换开发者签名+公证）
          codesign --force --deep --sign - "$APP"
          cd dist && zip -r ../Jinzhao-dev.zip Jinzhao.app

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Jinzhao-dev-app
          path: Jinzhao-dev.zip
          retention-days: 30
